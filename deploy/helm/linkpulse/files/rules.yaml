# linkpulse 알림 규칙(plan 0015). Prometheus 규칙 파일 형식 그대로다.
# - 차트의 PrometheusRule(templates/prometheusrule.yaml)이 이 파일을 spec으로 넣는다. Helm은 이 파일을 템플릿으로
#   읽지 않으므로(.Files.Get) 주석의 {{ $value }}가 그대로 Prometheus에 간다.
# - scripts/check-charts.sh가 promtool로 같은 파일을 시험한다(scripts/rules-test/linkpulse.test.yaml).
# 규칙은 사이트를 모른다. 알림을 어디로 보낼지는 사이트의 Alertmanager 설정이 정한다(AWS: infra/k8s, Slack만).
groups:
  # ---- SLO (30일 목표) ----
  # 가용성: 리다이렉트·링크 조회 응답 중 5xx가 아닌 비율 99.5%. 404·410은 정상 응답이다.
  # 지연: 같은 경로에서 서버 쪽 100ms 이하 비율 99%(0012 판정 경계와 같다). 히스토그램 경계 0.1이 앱 코드에 있다.
  # ALB가 만든 502·504·연결 실패는 앱 지표에 없다 — CloudWatch alb_elb_5xx·canary 알람이 맡는다(클러스터 밖, SMS).
  # 소진율 알림은 SRE 워크북의 다중 창 방식이다: 빠른 소진 14.4배(1시간 그리고 5분), 느린 소진 6배(6시간 그리고 30분).
  # 저트래픽 보호: 1시간 요청률이 초당 0.2 미만이면 평가하지 않는다 — 요청 몇 개의 5xx로 울리지 않게 한다.
  - name: linkpulse-slo
    rules:
      - record: linkpulse:slo_requests:rate1h
        expr: sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[1h]))
      - record: linkpulse:slo_availability:error_ratio_rate5m
        expr: |
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",code=~"5.."}[5m]))
          /
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[5m]))
      - record: linkpulse:slo_availability:error_ratio_rate30m
        expr: |
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",code=~"5.."}[30m]))
          /
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[30m]))
      - record: linkpulse:slo_availability:error_ratio_rate1h
        expr: |
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",code=~"5.."}[1h]))
          /
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[1h]))
      - record: linkpulse:slo_availability:error_ratio_rate6h
        expr: |
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",code=~"5.."}[6h]))
          /
          sum(rate(linkpulse_http_requests_total{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[6h]))
      - record: linkpulse:slo_latency:slow_ratio_rate5m
        expr: |
          1 - (
            sum(rate(linkpulse_http_request_duration_seconds_bucket{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",le="0.1"}[5m]))
            /
            sum(rate(linkpulse_http_request_duration_seconds_count{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[5m]))
          )
      - record: linkpulse:slo_latency:slow_ratio_rate30m
        expr: |
          1 - (
            sum(rate(linkpulse_http_request_duration_seconds_bucket{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",le="0.1"}[30m]))
            /
            sum(rate(linkpulse_http_request_duration_seconds_count{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[30m]))
          )
      - record: linkpulse:slo_latency:slow_ratio_rate1h
        expr: |
          1 - (
            sum(rate(linkpulse_http_request_duration_seconds_bucket{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",le="0.1"}[1h]))
            /
            sum(rate(linkpulse_http_request_duration_seconds_count{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[1h]))
          )
      - record: linkpulse:slo_latency:slow_ratio_rate6h
        expr: |
          1 - (
            sum(rate(linkpulse_http_request_duration_seconds_bucket{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}",le="0.1"}[6h]))
            /
            sum(rate(linkpulse_http_request_duration_seconds_count{route=~"GET /\\{code\\}|GET /api/links/\\{code\\}"}[6h]))
          )

      # 가용성 버짓 1 − 0.995 = 0.005. 14.4배 = 0.072, 6배 = 0.03.
      - alert: LinkpulseAvailabilityFastBurn
        expr: |
          linkpulse:slo_availability:error_ratio_rate1h > (14.4 * 0.005)
          and linkpulse:slo_availability:error_ratio_rate5m > (14.4 * 0.005)
          and linkpulse:slo_requests:rate1h >= 0.2
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: 가용성 에러 버짓 빠른 소진(14.4배, 1시간·5분)
          description: 리다이렉트·링크 조회의 1시간 5xx 비율이 {{ $value | humanizePercentage }}다(버짓 0.5%). 런북 docs/runbooks/alarm-response.md P-1.
      - alert: LinkpulseAvailabilitySlowBurn
        expr: |
          linkpulse:slo_availability:error_ratio_rate6h > (6 * 0.005)
          and linkpulse:slo_availability:error_ratio_rate30m > (6 * 0.005)
          and linkpulse:slo_requests:rate1h >= 0.2
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: 가용성 에러 버짓 느린 소진(6배, 6시간·30분)
          description: 리다이렉트·링크 조회의 6시간 5xx 비율이 {{ $value | humanizePercentage }}다(버짓 0.5%). 런북 docs/runbooks/alarm-response.md P-1.

      # 지연 버짓 1 − 0.99 = 0.01. 14.4배 = 0.144, 6배 = 0.06.
      - alert: LinkpulseLatencyFastBurn
        expr: |
          linkpulse:slo_latency:slow_ratio_rate1h > (14.4 * 0.01)
          and linkpulse:slo_latency:slow_ratio_rate5m > (14.4 * 0.01)
          and linkpulse:slo_requests:rate1h >= 0.2
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: 지연 에러 버짓 빠른 소진(14.4배, 1시간·5분)
          description: 리다이렉트·링크 조회 중 100ms를 넘긴 비율이 1시간 {{ $value | humanizePercentage }}다(버짓 1%). 런북 docs/runbooks/alarm-response.md P-1.
      - alert: LinkpulseLatencySlowBurn
        expr: |
          linkpulse:slo_latency:slow_ratio_rate6h > (6 * 0.01)
          and linkpulse:slo_latency:slow_ratio_rate30m > (6 * 0.01)
          and linkpulse:slo_requests:rate1h >= 0.2
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: 지연 에러 버짓 느린 소진(6배, 6시간·30분)
          description: 리다이렉트·링크 조회 중 100ms를 넘긴 비율이 6시간 {{ $value | humanizePercentage }}다(버짓 1%). 런북 docs/runbooks/alarm-response.md P-1.

  # ---- 클릭 파이프라인(plan 0013 이월 알림) ----
  # 카운터는 파드마다 프로세스 시작부터 센다. increase()가 재시작(리셋)을 처리한다.
  - name: linkpulse-clicks
    rules:
      - alert: LinkpulseClicksDropped
        expr: sum by (pod) (increase(linkpulse_clicks_dropped_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 클릭 유실 — 대기 상한에 걸려 버린 클릭이 있다
          description: '{{ $labels.pod }}가 5분 동안 클릭 {{ $value | humanize }}개를 버렸다. 큐(SQS)로 보내지 못한 코드가 상한(10만)까지 쌓였다. 런북 docs/runbooks/alarm-response.md P-2.'
      # 일시적인 발행 실패는 재시도 목록이 흡수한다. 2분 창마다 실패가 5분 동안 이어질 때만 울린다.
      # 창을 2분으로 둔 것은 긁기 간격이 1분이어도 창 안에 표본이 둘 이상 들게 하려고다(Prometheus 3은 창 왼쪽 끝을 뺀다).
      - alert: LinkpulseClickPublishErrors
        expr: sum by (pod) (increase(linkpulse_clicks_publish_errors_total[2m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 클릭 발행 실패가 5분 넘게 이어진다
          description: '{{ $labels.pod }}가 큐(SQS)로 배치를 보내지 못하고 있다. 지금은 메모리에 쌓이고, 상한에 닿으면 유실(LinkpulseClicksDropped)이 된다. 런북 docs/runbooks/alarm-response.md P-2.'
      - alert: LinkpulseClickApplyErrors
        expr: sum by (pod) (increase(linkpulse_clicks_apply_errors_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 클릭 반영 실패
          description: '{{ $labels.pod }}의 워커가 5분 동안 {{ $value | humanize }}번 반영에 실패했다. 메시지는 큐에 남아 다시 오고, 계속 실패하면 DLQ로 간다. 런북 docs/runbooks/alarm-response.md P-2.'

  # ---- 관리자 인증 실패(하드닝 백로그) ----
  # 401은 관리자 경로(admin.require)에서만 나온다. 임계값은 초기값이다.
  - name: linkpulse-admin
    rules:
      - alert: LinkpulseAdminAuthFailures
        expr: sum(increase(linkpulse_http_requests_total{code="401"}[10m])) > 20
        labels:
          severity: warning
        annotations:
          summary: 관리자 인증 실패가 10분에 20건을 넘었다
          description: 관리자 경로 401이 10분 동안 {{ $value | humanize }}건이다. 비밀번호 추측일 수 있다. 런북 docs/runbooks/alarm-response.md P-3.

  # ---- 배포(ArgoCD, plan 0014 리스크 표) ----
  # argocd_app_info는 ArgoCD 애플리케이션 컨트롤러 지표다(사이트가 ArgoCD 차트의 ServiceMonitor를 켠다).
  # max by (name)으로 묶는다 — 상태 라벨이 바뀌어도(OutOfSync → Unknown) for 타이머가 다시 시작하지 않게 한다.
  - name: linkpulse-argocd
    rules:
      - alert: LinkpulseArgoCDAppUnhealthy
        expr: max by (name) (argocd_app_info{sync_status!="Synced"} or argocd_app_info{health_status!="Healthy"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ArgoCD 애플리케이션이 15분 넘게 Synced·Healthy가 아니다
          description: '{{ $labels.name }}의 동기화 또는 상태가 15분 동안 정상이 아니다. 새 파드가 뜨지 않으면 롤링이 멈추고 옛 파드가 남는다. 런북 docs/runbooks/alarm-response.md P-4.'
