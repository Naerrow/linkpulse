# main 푸시 시 검증 → 멀티 아키텍처 이미지 → GHCR 푸시(plan 0014).
# 배포는 여기서 하지 않는다. 클러스터 안의 ArgoCD Image Updater가 `main` 태그의 다이제스트가 바뀐 것을 보고
# ArgoCD가 롤링 배포한다(GitOps). 그래서 이 워크플로에는 AWS·클러스터 권한이 없고,
# 인프라가 꺼져 있어도 성공한다. 롤백은 ArgoCD에서 이미지를 고정한다(docs/runbooks/alarm-response.md).
name: deploy

on:
  push:
    branches: [main]
  # 같은 커밋을 다시 올릴 때(GHCR 푸시 확인 등). 입력은 없다 — 롤백은 ArgoCD가 맡는다.
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GITHUB_TOKEN으로 GHCR에 푸시한다(장기 토큰 없음)

# 푸시를 직렬화한다. `main` 태그가 늦게 끝난 옛 커밋으로 되돌아가지 않게.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR 이름은 소문자여야 한다(소유자 Naerrow → naerrow).
  IMAGE: ghcr.io/naerrow/linkpulse

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # 한 runner에서 검증→빌드→푸시까지 이어 간다. job을 여러 번 새로 배정받는 구조는
    # GitHub-hosted runner 장애 때 실패 표면을 키운다(2026-07-09 회고).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: gofmt 검사
        working-directory: app
        run: test -z "$(gofmt -l .)" || { echo "gofmt 필요:"; gofmt -l .; exit 1; }

      - name: go vet
        working-directory: app
        run: make vet

      - name: 단위 테스트
        working-directory: app
        run: make test

      # x86 러너에서 arm64·amd64를 함께 만든다. Dockerfile이 $BUILDPLATFORM에서 GOARCH로 크로스컴파일해
      # QEMU가 필요 없다(ADR 0001). amd64는 P6 집 서버용이다 — 같은 이미지를 양쪽에서 쓴다(AGENTS.md §5).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # <sha>는 롤백 고정용, main은 Image Updater가 다이제스트를 지켜보는 태그다.
      # source 라벨이 패키지를 이 저장소에 연결한다.
      - name: 빌드 & 푸시 (arm64 + amd64)
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision="$SHA" \
            -t "$IMAGE:$SHA" -t "$IMAGE:main" \
            --push app
