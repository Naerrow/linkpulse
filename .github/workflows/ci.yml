# PR 검증: Go 체크 + Helm 차트 검사 + Docker 멀티 아키텍처 빌드.
# push 트리거는 두지 않는다 — main push는 deploy.yml이 같은 Go 체크를 하고 이미지를 푸시한다.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go vet / test / fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app # Makefile과 go 모듈이 app/ 아래(모노레포)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod # go.mod의 go 지시문과 자동 동기(버전 드리프트 방지)
          cache-dependency-path: app/go.sum # 캐시 키는 repo 루트 기준 경로

      - name: gofmt 검사
        run: test -z "$(gofmt -l .)" || { echo "gofmt 필요:"; gofmt -l .; exit 1; }

      - name: go vet
        run: make vet

      - name: 단위 테스트
        run: make test

      # 통합 게이트(build tag: integration)는 CI에서 **실행하지 않는다** — Postgres가 없다.
      # 대신 컴파일은 한다. 이게 없으면 배포 게이트 파일이 조용히 깨진 채 머지되고,
      # 정작 필요할 때(2-4·2-6) 빌드 오류로 멈춘다. DB가 필요 없어 비용은 0이다.
      - name: 통합 테스트 컴파일 검사
        run: go vet -tags=integration ./...

      # Helm 차트 검사(plan 0014). 별도 job으로 나누지 않는 이유는 러너 배정을 1회로 유지하기
      # 위해서다(2026-07-09 배포 실패 회고 — job이 늘면 실패 표면이 커진다).
      # 도구는 버전과 체크섬을 고정해 받는다.
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: kubeconform 설치
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      # 알림 규칙 단위 테스트(promtool)와 Alertmanager 설정 검사(amtool)(plan 0015).
      # 버전은 infra/k8s가 고정한 kube-prometheus-stack의 Prometheus·Alertmanager와 맞춘다. 체크섬은 각 릴리스의 sha256sums.txt.
      - name: promtool·amtool 설치
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          echo "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /usr/local/bin --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          curl -fsSL -o /tmp/alertmanager.tar.gz https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz
          echo "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  /tmp/alertmanager.tar.gz" | sha256sum -c -
          tar -xzf /tmp/alertmanager.tar.gz -C /usr/local/bin --strip-components=1 alertmanager-0.34.1.linux-amd64/amtool

      - name: Helm 차트 검사
        working-directory: .
        run: scripts/check-charts.sh

      # Dockerfile smoke test: PR에서 배포와 동일한 멀티 아키텍처 크로스빌드가 x86에서 성공하는지 확인한다.
      # deploy.yml이 x86 GA 러너 + buildx로 arm64·amd64를 크로스컴파일하므로(ADR 0001), 그 경로를 여기서
      # 미리 검증해 조용한 회귀를 막는다. --push/--load 없이 빌드만 해 성공 여부만 본다.
      # working-directory가 app이라 build context는 현재 디렉터리(.)이다.
      - name: buildx 준비
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Docker 멀티 아키텍처 크로스빌드 검증
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/arm64,linux/amd64 -t linkpulse-app:ci .
