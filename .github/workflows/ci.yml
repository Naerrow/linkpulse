# PR 검증 + deploy.yml이 재사용(workflow_call)하는 Go/Docker 체크.
# push 트리거는 두지 않는다 — main push는 deploy.yml이 이 워크플로를 호출하므로 중복 실행을 막는다.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go vet / test / fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app # Makefile과 go 모듈이 app/ 아래(모노레포)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod # go.mod의 go 지시문과 자동 동기(버전 드리프트 방지)
          cache-dependency-path: app/go.sum # 캐시 키는 repo 루트 기준 경로

      - name: gofmt 검사
        run: test -z "$(gofmt -l .)" || { echo "gofmt 필요:"; gofmt -l .; exit 1; }

      - name: go vet
        run: make vet

      - name: 단위 테스트
        run: make test

      # 통합 게이트(build tag: integration)는 CI에서 **실행하지 않는다** — Postgres가 없다.
      # 대신 컴파일은 한다. 이게 없으면 배포 게이트 파일이 조용히 깨진 채 머지되고,
      # 정작 필요할 때(2-4·2-6) 빌드 오류로 멈춘다. DB가 필요 없어 비용은 0이다.
      - name: 통합 테스트 컴파일 검사
        run: go vet -tags=integration ./...

      # rotation-redeploy Lambda의 handler 테스트. 별도 job으로 나누지 않는 이유는 러너 배정을
      # 1회로 유지하기 위해서다(2026-07-09 배포 실패 회고 — job이 늘면 실패 표면이 커진다).
      # 러너 기본 Python에 기대지 않고 Lambda 런타임과 같은 3.13으로 고정한다 — 버전이 다르면
      # 수집·문법 드리프트가 CI에서 안 잡힌다. 외부 의존성이 없어 install 단계가 없다
      # (테스트는 fake client를 넘기므로 boto3를 import하지 않는다).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lambda handler 단위 테스트
        working-directory: infra/prod/lambda/rotation_redeploy
        run: python -m unittest discover -v

      # Dockerfile smoke test: PR에서 배포와 동일한 arm64 크로스빌드가 x86에서 성공하는지 확인한다.
      # deploy.yml이 x86 GA 러너 + buildx로 arm64를 크로스컴파일하므로(ADR 0001), 그 경로를 여기서
      # 미리 검증해 조용한 회귀를 막는다. --push/--load 없이 빌드만 해 성공 여부만 본다.
      # working-directory가 app이라 build context는 현재 디렉터리(.)이다.
      - name: buildx 준비
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Docker arm64 크로스빌드 검증
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/arm64 -t linkpulse-app:ci .
