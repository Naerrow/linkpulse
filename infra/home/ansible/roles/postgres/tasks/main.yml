# 집 Postgres(plan 0017 설계 3). RDS와 같은 메이저(16), 앱은 sslmode=require로 k3s 노드 IP에서만 붙는다.
- name: PostgreSQL·Ansible 모듈 의존성 설치
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - python3-psycopg2
    state: present

# listen·ssl·wal_level. listen_addresses·wal_level은 재시작해야 바뀐다.
- name: 설정 조각(conf.d)
  ansible.builtin.template:
    src: linkpulse.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/conf.d/linkpulse.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: pg_hba(k3s 노드에서 오는 linkpulse 연결만)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Reload postgresql

- name: 바뀐 설정을 지금 반영
  ansible.builtin.meta: flush_handlers

# 비밀번호는 맥의 파일에서 읽는다(openssl rand -hex 32로 만든 것). 화면·로그에 찍지 않는다(no_log).
# 회전 때도 이 파일을 바꾸고 이 역할을 다시 돌린다 — 비밀번호의 원본은 그 파일 하나다(런북 home-site.md).
- name: 역할 linkpulse
  community.postgresql.postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ lookup('ansible.builtin.file', pg_password_file) }}"
  become: true
  become_user: postgres
  no_log: true

# 소유자가 linkpulse여야 앱이 기동 때 스키마를 만든다. PG15부터 PUBLIC은 public 스키마에 CREATE 권한이 없어
# postgres 소유 DB에서는 "permission denied for schema public"으로 실패한다(RDS는 마스터 사용자가 곧 앱 사용자였다).
- name: DB linkpulse(소유자 linkpulse)
  community.postgresql.postgresql_db:
    name: "{{ pg_db }}"
    owner: "{{ pg_user }}"
  become: true
  become_user: postgres

# 방화벽: SSH는 집 LAN에서만, 5432는 k3s 노드에서만. 규칙을 먼저 넣고 켠다(켜는 순간 SSH가 끊기지 않게).
- name: ufw — SSH는 집 LAN에서만
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ lan_cidr }}"

- name: ufw — 5432는 k3s 노드에서만
  community.general.ufw:
    rule: allow
    port: "5432"
    proto: tcp
    src: "{{ k3s_node_ip }}"

- name: ufw 켜기(들어오는 것은 기본 거부)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
