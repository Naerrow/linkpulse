# 실제 인벤토리는 Terraform 출력으로 만든다(집 IP가 들어 있어 git에 넣지 않는다):
#   terraform -chdir=infra/home output -raw ansible_inventory > infra/home/ansible/inventory.yml
all:
  vars:
    ansible_user: ubuntu
    lan_cidr: 192.168.0.0/24
  children:
    k3s:
      hosts:
        lp-k3s-1:
          ansible_host: 192.168.0.50
    postgres:
      hosts:
        lp-pg-1:
          ansible_host: 192.168.0.51
