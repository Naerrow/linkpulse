# infra/home/ansible에서 실행한다: cd infra/home/ansible && ansible-playbook site.yml
[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
# 처음 보는 호스트 키는 받고, 바뀐 키는 거부한다. VM을 다시 만들면 키가 바뀌므로 ssh-keygen -R <IP>가 먼저다(런북 home-site.md).
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
# postgres 사용자로 become하는 태스크가 임시 파일 권한 문제 없이 돈다.
pipelining = True
