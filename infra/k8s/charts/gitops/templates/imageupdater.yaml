# Argo CD Image Updater v1.x 설정(CR). `main` 태그의 다이제스트가 바뀌면 Application의 helm 파라미터를 바꾼다.
# write-back은 argocd다 — git에 커밋하지 않는다("main 직접 푸시 금지"와 부딪히지 않는다).
# 롤백 때는 Image Updater를 0개로 줄여 멈추고 이미지를 고정한다(docs/runbooks/alarm-response.md R-1).
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: linkpulse
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: linkpulse
      images:
        - alias: app
          imageName: {{ .Values.image | quote }}
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
