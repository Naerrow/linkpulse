# 모두 infra/k8s/main.tf가 채운다. 여기 기본값은 helm template 검사용 빈 값이다.

# 앱이 envFrom으로 읽는 설정(비밀 아님). 키가 곧 env 이름이다.
config: {}

# 앱이 envFrom으로 읽는 비밀. 빈 값인 키는 넣지 않는다(앱은 미설정과 빈 값을 같게 본다 — 관리자 기능 꺼짐·예외 없음).
secret:
  ADMIN_TOKEN_SHA256: ""
  RATE_LIMIT_EXEMPT_IPS: ""

# 기존 타깃 그룹(infra/prod alb.tf, ip 타입)에 앱 Service의 파드 IP를 등록한다.
targetGroupBinding:
  targetGroupARN: ""
  vpcID: ""
  serviceName: linkpulse
  servicePort: 8080
