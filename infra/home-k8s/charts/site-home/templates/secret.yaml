# 이름은 앱 차트(deploy/helm/linkpulse values.yaml site.secretName)와 맞아야 한다.
# 앱이 secretRef로 통째로 읽으므로 Secret이 없으면 파드가 뜨지 않는다 — 값이 다 비어도 Secret은 만든다.
apiVersion: v1
kind: Secret
metadata:
  name: linkpulse-site-secret
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret }}
  {{- if $v }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
